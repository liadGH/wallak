<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wallak</title>
<meta name="description" content="Your training, food and body, all in one place.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wallak">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbf7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first column (max 460px), five-tab bottom bar, full-screen sheets for setup and live workout.
   Colour: each area owns a colour - training coral, food green, body violet, daily habits sun yellow. Light by default, dark follows the phone. */
:root {
  --bg: #fbf7f0; --s1: #ffffff; --s2: #f4efe7; --s3: #e9e2d7; --line: #ece5da;
  --fg: #1d1a22; --muted: #6f6878; --dim: #a39cab;
  --coral: #ff6b4a; --coral-soft: #ffe6de; --coral-ink: #c43d1f;
  --green: #1fae68; --green-soft: #daf5e6; --green-ink: #137a47;
  --violet: #7c4df0; --violet-soft: #ece4ff; --violet-ink: #5b2fd0;
  --sun: #ffc22e; --sun-soft: #fff2c9; --sun-ink: #8a6200;
  --on: #ffffff; --shadow: 0 1px 2px rgba(60,40,20,.06), 0 6px 18px rgba(60,40,20,.06);
  --display: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141218; --s1: #1f1c25; --s2: #2a2631; --s3: #37323f; --line: #2e2936;
  --fg: #f5f2f8; --muted: #a8a0b2; --dim: #6f6878;
  --coral: #ff7a5c; --coral-soft: #3d2320; --coral-ink: #ffa48e;
  --green: #36d68a; --green-soft: #15332a; --green-ink: #7be8b4;
  --violet: #9d7bff; --violet-soft: #2a2342; --violet-ink: #c3b0ff;
  --sun: #ffcc3d; --sun-soft: #383015; --sun-ink: #ffdc7a;
  --on: #ffffff; --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141218; --s1: #1f1c25; --s2: #2a2631; --s3: #37323f; --line: #2e2936;
  --fg: #f5f2f8; --muted: #a8a0b2; --dim: #6f6878;
  --coral: #ff7a5c; --coral-soft: #3d2320; --coral-ink: #ffa48e;
  --green: #36d68a; --green-soft: #15332a; --green-ink: #7be8b4;
  --violet: #9d7bff; --violet-soft: #2a2342; --violet-ink: #c3b0ff;
  --sun: #ffcc3d; --sun-soft: #383015; --sun-ink: #ffdc7a;
  --on: #ffffff; --shadow: none; color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100% }
body { margin: 0; overscroll-behavior-y: none }
html, body, button, input, select, textarea, label, a { touch-action: manipulation } /* no double-tap zoom */
img { max-width: 100% }
[hidden] { display: none !important }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45 }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none }
input, select, textarea { font: inherit; color: var(--fg); font-size: 16px } /* 16px+ stops iPhone auto-zoom on focus */
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2.5px solid var(--violet); outline-offset: 2px }

.app { max-width: 460px; margin: 0 auto; padding-inline: 16px; padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px)) }
.screen { animation: rise .3s ease both }
@keyframes rise { from { opacity: .3; transform: translateY(8px) } to { opacity: 1; transform: none } }
@keyframes pop { 0% { transform: scale(.9); opacity: 0 } 70% { transform: scale(1.03) } 100% { transform: none; opacity: 1 } }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 18px }
.eyebrow { font-size: 12.5px; font-weight: 600; color: var(--muted) }
.h1 { font-family: var(--display); font-weight: 800; font-size: 36px; line-height: 1.02; letter-spacing: -.5px; margin: 2px 0 0; text-wrap: balance }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap }
.pill.sun { background: var(--sun-soft); color: var(--sun-ink) }

.stack { display: grid; gap: 14px }
.card { background: var(--s1); border-radius: 24px; padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--line) }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px }
.card-t { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 17px }
.ico { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; flex: none }
.ico svg { width: 18px; height: 18px }
.c-coral .ico { background: var(--coral-soft); color: var(--coral) }
.c-green .ico { background: var(--green-soft); color: var(--green) }
.c-violet .ico { background: var(--violet-soft); color: var(--violet) }
.c-sun .ico { background: var(--sun-soft); color: var(--sun-ink) }
.link { font-size: 13.5px; font-weight: 700; color: var(--violet-ink) }

.hero { position: relative; overflow: hidden; background: var(--coral); color: var(--on); border: 0; padding: 22px 20px }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.14) }
.hero::before { width: 190px; height: 190px; right: -60px; top: -70px }
.hero::after { width: 110px; height: 110px; right: 40px; bottom: -60px; background: rgba(255,210,80,.35) }
.hero > * { position: relative; z-index: 1 }
.hero .lab { font-size: 13px; font-weight: 700; opacity: .9 }
.hero .big { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -.8px; margin: 6px 0 6px }
.hero .sub { color: rgba(255,255,255,.88) }
.hero.rest { background: var(--violet) }
.hero.done { background: var(--green) }
.hero .btn.white { background: #fff; color: var(--coral-ink) }
.hero.rest .btn.white { color: var(--violet-ink) } .hero.done .btn.white { color: var(--green-ink) }
.hero .btn.clear { background: rgba(255,255,255,.2); color: #fff }

.sub { color: var(--muted); font-size: 13.5px }
.row { display: flex; align-items: center; gap: 10px }
.between { justify-content: space-between }
.grow { flex: 1; min-width: 0 }
.num { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.stat .v { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; letter-spacing: -.5px }
.stat .v small { font-size: 15px; color: var(--muted); margin-left: 3px; font-weight: 600 }
.stat .l { font-size: 12.5px; color: var(--muted); margin-top: 4px }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 16px; padding: 13px 18px; font-weight: 700; font-size: 15px; transition: transform .12s }
.btn:active { transform: scale(.96) }
.btn.coral { background: var(--coral); color: var(--on) }
.btn.green { background: var(--green); color: var(--on) }
.btn.violet { background: var(--violet); color: var(--on) }
.btn.sun { background: var(--sun); color: #3a2a00 }
.btn.soft { background: var(--s2); color: var(--fg) }
.btn.block { width: 100% }
.btn.sm { padding: 8px 13px; font-size: 13.5px; border-radius: 12px }
.btn.danger { background: var(--coral-soft); color: var(--coral-ink) }
.btn[disabled] { opacity: .4; pointer-events: none }

.cycle { display: flex; gap: 6px }
.cycle i { flex: 1; height: 34px; border-radius: 10px; background: var(--s2); display: grid; place-items: center; font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--dim) }
.cycle i.on { background: var(--coral); color: var(--on) }
.cycle i.now { box-shadow: inset 0 0 0 2px var(--coral); color: var(--coral-ink) }
.cycle i.rest { background: var(--violet-soft); color: var(--violet-ink) }
.cycle i.rest.now { box-shadow: inset 0 0 0 2px var(--violet) }
.opt-card { display: grid; gap: 2px; width: 100%; text-align: left; padding: 13px 14px; border-radius: 16px; background: var(--s2); border: 2px solid transparent }
.opt-card b { font-weight: 700 }
.opt-card span { font-size: 13px; color: var(--muted) }
.opt-card.on { border-color: var(--coral); background: var(--coral-soft) }
.sched-body { padding-top: 4px }
.pt-row { display: flex; flex-wrap: wrap; gap: 6px }
.pt { flex: 1 0 44px; min-height: 54px; border-radius: 14px; background: var(--violet-soft); color: var(--violet-ink); font-weight: 700; font-size: 13px; display: grid; place-items: center; line-height: 1.15 }
.pt small { display: block; font-size: 10.5px; font-weight: 600; opacity: .75 }
.pt.t { background: var(--coral); color: var(--on) }
.wk-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px }
.wk { height: 48px; border-radius: 12px; background: var(--s2); font-weight: 700; font-size: 13px }
.wk.on { background: var(--coral); color: var(--on) }

.list { display: grid }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line) }
.li:first-child { border-top: 0; padding-top: 2px }
.li .t { font-weight: 600 }
.badge { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; font-family: var(--display); font-weight: 800; font-size: 15px; background: var(--sun-soft); color: var(--sun-ink) }
.badge.coral { background: var(--coral-soft); color: var(--coral-ink) }

.bar { height: 12px; border-radius: 6px; background: var(--s2); overflow: hidden }
.bar > i { display: block; height: 100%; border-radius: 6px; transition: width .6s cubic-bezier(.3,1.4,.5,1) }
.bar.green > i { background: var(--green) } .bar.sun > i { background: var(--sun) } .bar.violet > i { background: var(--violet) } .bar.coral > i { background: var(--coral) }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none }
.chips::-webkit-scrollbar { display: none }
.chip { padding: 8px 13px; border-radius: 999px; background: var(--s2); font-size: 13.5px; font-weight: 600; white-space: nowrap; flex: none }
.chip.on { background: var(--violet); color: var(--on) }
.chip.green { background: var(--green-soft); color: var(--green-ink) }
.seg { display: flex; background: var(--s2); border-radius: 14px; padding: 4px }
.seg button { flex: 1; padding: 8px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--muted) }
.seg button.on { background: var(--s1); color: var(--fg); box-shadow: var(--shadow) }

.field { background: var(--s2); border: 1.5px solid transparent; border-radius: 14px; padding: 12px 14px; width: 100%; min-width: 0 }
.field:focus { border-color: var(--violet); outline: none }
.field::placeholder { color: var(--dim) }
.lbl { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; display: block }

svg.chart { width: 100%; height: auto; display: block }
.chart text { fill: var(--dim); font-family: var(--body); font-size: 10px }
.chart .grid { stroke: var(--line) }

.banner { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 18px; background: var(--sun-soft); color: var(--sun-ink); font-size: 13.5px; font-weight: 500 }
.tip { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 18px; background: var(--violet-soft); color: var(--violet-ink); font-size: 14px; animation: pop .4s ease both }
.tip b { display: block; font-family: var(--display); font-size: 15px; margin-bottom: 2px }
.tip button { flex: none; font-weight: 700; font-size: 13px; padding: 6px 10px; border-radius: 10px; background: var(--violet); color: var(--on) }
.empty-card { text-align: center; padding: 26px 18px }
.empty-card .big-ico { width: 64px; height: 64px; border-radius: 22px; margin: 0 auto 12px; display: grid; place-items: center }
.empty-card .big-ico svg { width: 32px; height: 32px }
.empty { color: var(--muted); font-size: 13.5px; padding: 6px 0 }

.mood { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px }
.mood button { background: var(--s2); border-radius: 14px; padding: 10px 0 8px; display: grid; justify-items: center; gap: 2px }
.mood button .n { font-family: var(--display); font-size: 22px; font-weight: 800 }
.mood button .w { font-size: 10.5px; color: var(--muted) }
.mood button.on { background: var(--sun); color: #3a2a00 }
.mood button.on .w { color: #3a2a00 }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--s1) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line) }
.tabs-in { max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr) }
.tab { display: grid; justify-items: center; gap: 3px; padding: 6px 0; color: var(--dim); font-size: 11px; font-weight: 700 }
.tab svg { width: 24px; height: 24px }
.tab.on[data-v="home"], .tab.on[data-v="train"] { color: var(--coral) }
.tab.on[data-v="prog"] { color: var(--violet) } .tab.on[data-v="log"] { color: var(--green) } .tab.on[data-v="more"] { color: var(--sun-ink) }

.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; animation: up .3s ease both }
@keyframes up { from { transform: translateY(30px); opacity: 0 } to { transform: none; opacity: 1 } }
.sheet-in { max-width: 460px; margin: 0 auto; padding-inline: 16px; padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) }
.sheet-top { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px }
.timer { font-family: var(--display); font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--coral) }
.ex { background: var(--s1); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 22px; padding: 14px; margin-top: 12px }
.ex-name { font-weight: 700; font-size: 17px }
.sugg { margin-top: 8px; font-size: 13px; padding: 8px 10px; border-radius: 12px; background: var(--coral-soft); color: var(--coral-ink) }
.sets { margin-top: 10px; display: grid; gap: 6px }
.set { display: grid; grid-template-columns: 22px minmax(0,1fr) 62px 52px 56px 36px; gap: 6px; align-items: center }
.set.head { font-size: 11px; font-weight: 700; color: var(--dim) }
.set .i { font-family: var(--display); font-weight: 700; color: var(--muted); text-align: center }
.set .prev { font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums }
.set input, .set select { width: 100%; min-width: 0; background: var(--s2); border: 0; border-radius: 10px; padding: 9px 4px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none }
.set input::placeholder { color: var(--dim) }
.set.done input, .set.done select { background: var(--green-soft); color: var(--green-ink) }
.set .ok { width: 36px; height: 36px; border-radius: 11px; background: var(--s2); display: grid; place-items: center }
.set.done .ok { background: var(--green) }
.set .ok svg { width: 16px; height: 16px; stroke: var(--dim) }
.set.done .ok svg { stroke: #fff }
.foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 30%) }
.foot .in { max-width: 460px; margin: 0 auto; display: flex; gap: 10px }

/* Setup */
.ob-prog { display: flex; gap: 4px; margin-bottom: 26px }
.ob-prog i { flex: 1; height: 5px; border-radius: 3px; background: var(--s3) }
.ob-prog i.on { background: var(--coral) }
.ob-art { width: 76px; height: 76px; border-radius: 26px; display: grid; place-items: center; margin-bottom: 18px; animation: pop .45s ease both }
.ob-art svg { width: 38px; height: 38px }
.ob h2 { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1.05; letter-spacing: -.5px; margin: 0 0 8px; text-wrap: balance }
.ob p.lead { color: var(--muted); margin: 0 0 22px; font-size: 15.5px }
.ob .fields { display: grid; gap: 14px }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.choice button { padding: 13px; border-radius: 14px; background: var(--s2); font-weight: 700 }
.choice button.on { background: var(--violet); color: var(--on) }
.stepper { display: flex; align-items: center; gap: 14px; background: var(--s2); border-radius: 18px; padding: 10px 12px }
.stepper .num { font-size: 34px; min-width: 40px; text-align: center }
.stepper button { width: 44px; height: 44px; border-radius: 14px; background: var(--s1); font-size: 22px; font-weight: 700; box-shadow: var(--shadow) }
.steps { counter-reset: s; display: grid; gap: 10px; margin: 0; padding: 0; list-style: none }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 14.5px }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--sun-soft); color: var(--sun-ink); font-weight: 800; font-family: var(--display) }
.steps b { font-weight: 700 }

.modal { position: fixed; inset: 0; z-index: 30; background: rgba(20,14,30,.45); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); display: grid; align-items: end; justify-items: center }
.modal-c { width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; background: var(--s1); border-radius: 28px 28px 0 0; padding: 22px 16px calc(20px + env(safe-area-inset-bottom, 0px)); animation: up .25s ease both }
.mh { font-family: var(--display); font-weight: 800; font-size: 26px; margin: 0 0 12px }
.pr-burst { text-align: center; padding: 6px 0 }
.pr-ring { width: 120px; height: 120px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; background: var(--sun); position: relative; animation: pop .5s ease both }
.pr-ring::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px dashed var(--coral); animation: spin 6s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }
.pr-ring span { font-family: var(--display); font-weight: 800; font-size: 42px; color: #3a2a00 }
.rt-ex { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 12px; border-radius: 16px; background: var(--s2) }
.rt-ex .ctl { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted) }
.rt-ex input { width: 46px; text-align: center; background: var(--s1); border: 0; border-radius: 9px; padding: 7px 2px; font-weight: 600 }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 13.5px; font-weight: 600; animation: rise .2s ease both; max-width: calc(100% - 32px) }
.absbox { display: flex; gap: 12px; align-items: flex-start; margin-top: 12px; padding: 14px; border-radius: 20px; background: var(--sun-soft); color: var(--sun-ink); font-size: 13.5px }
.absbox b { font-family: var(--display); font-size: 16px }
.absbox .star { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: #3a2a00; font-size: 20px }
.absbox.on { background: var(--green-soft); color: var(--green-ink); animation: pop .4s ease both }
.absbox.on .star { background: var(--green); color: #fff }
.absbox .chip { background: var(--s1); color: var(--fg) }
.abs-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--sun-soft); color: var(--sun-ink); vertical-align: 1px }
.abs-tag.mine { background: var(--violet-soft); color: var(--violet-ink) }
.pill.abs { background: rgba(255,255,255,.22); color: #fff; margin: 2px 0 8px }
.absdots { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px }
.absdots i { aspect-ratio: 1; max-width: 100%; border-radius: 8px; background: var(--s2); display: grid; place-items: center; font-style: normal; font-size: 12px }
.absdots i.on { background: var(--sun); color: #3a2a00 }
.check { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--dim); display: grid; place-items: center; flex: none; background: var(--s1) }
.check.on { background: var(--green); border-color: var(--green) }

/* ---------- exercise library ---------- */

/* ---------- state: starts empty, filled by the setup guide ---------- */
const blank = () => ({ v: 2, setupDone: false, obStep: 0,
  profile: { name: "", weight: "", height: "", age: "", sex: "" },
  settings: { cal: "", protein: "", lastBackup: null, schedule: { mode: "pattern", pattern: [1, 1, 1, 0], days: [1, 3, 5], anchor: null, start: 0 } },
  routines: [], workouts: [], body: [], habits: {}, food: {}, savedFoods: [], goals: [], custom: [], tipsSeen: {}, active: null });
const KEY = "wallak.v2";
let S; try { S = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { S = null; }
if (!S) S = blank();
if (!S.settings.schedule) { const on = S.settings.on || 3, off = S.settings.off ?? 1; S.settings.schedule = { mode: "pattern", pattern: [...Array(on).fill(1), ...Array(off).fill(0)], days: [1, 3, 5], anchor: todayKey(), start: 0 }; }

let tab = "home", progEx = null, progMetric = "e1rm", logDay = todayKey(), discardArmed = false, draft = null, pickMode = "workout";

const exById = id => LIB.find(e => e.id === id) || S.custom.find(e => e.id === id) || { id, name: id, muscle: "" };

const isTime = id => !!exById(id).time;

const defRange = id => isTime(id) ? { lo: 30, hi: 60 } : isCore(id) ? { lo: 10, hi: 20 } : { lo: 8, hi: 12 };
function absStreak() { const ws = sorted(); let n = 0; for (let i = ws.length - 1; i >= 0 && ws[i].abs; i--) n++; return n; }
function bestAbsRun() { let b = 0, c = 0; sorted().forEach(w => { c = w.abs ? c + 1 : 0; b = Math.max(b, c); }); return b; }
const sorted = () => [...S.workouts].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
const trainedOn = k => S.workouts.some(w => w.date === k);

function lastFor(ex) {
  const ws = sorted(); for (let i = ws.length - 1; i >= 0; i--) { const e = ws[i].exercises.find(x => x.ex === ex); if (e) return e.sets; }
  return null;
}
function suggest(ex, lo = 8, hi = 12) {

  if (top === 0) { const best = Math.max(...last.map(s => s.r)); const t = isTime(ex); return { w: 0, r: best + (t ? 5 : 1), why: t ? "hold 5 seconds longer than your best" : "one more rep than your best" }; }

function exHistory(ex) {

/* Training schedule: a repeating pattern that waits for you when you miss a training day,

const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

const sched = () => S.settings.schedule;
function patternPos() {

function blockOf(p, i) { let a = i, b = i; while (a > 0 && p[a - 1] === p[i]) a--; while (b < p.length - 1 && p[b + 1] === p[i]) b++; return { k: i - a + 1, n: b - a + 1 }; }

    const p = sc.pattern, pos = patternPos(), isT = !!p[pos], bl = blockOf(p, pos), small = p.length > 8;
    const tiles = p.map((x, i) => {
      const past = i < pos || (i === pos && doneToday);
      if (x) return `<i class="${past ? "on" : i === pos ? "now" : ""}">${past ? "✓" : small ? "" : "Train"}</i>`;
      return `<i class="rest ${i === pos && !doneToday ? "now" : ""}">${small ? "" : "Rest"}</i>`;

  }

}
function schedEditor() {

      <div class="pt-row">${sc.pattern.map((x, i) => `<button class="pt ${x ? "t" : ""}" data-act="schedTile" data-v="${i}"><span>${x ? "Train" : "Rest"}<small>Day ${i + 1}</small></span></button>`).join("")}</div>

function dayStreak() {
  const any = k => trainedOn(k) || (S.food[k] || []).length || S.body.some(b => b.date === k) || (S.habits[k] && S.habits[k].mood);
  let k = todayKey(); if (!any(k)) k = addDays(k, -1);

}

/* ---------- chart ---------- */
function chart(series, { h = 150, color = "violet", dots = null } = {}) {
  const all = [...series, ...(dots || [])];
  if (all.length < 2) return `<div class="empty">Log this at least twice to see a chart.</div>`;
  const W = 340, H = h, pl = 34, pr = 12, pt = 10, pb = 22;
  const ts = all.map(p => parseKey(p.date).getTime()); const x0 = Math.min(...ts), x1 = Math.max(...ts);
  let y0 = Math.min(...all.map(p => p.y)), y1 = Math.max(...all.map(p => p.y)); const pY = (y1 - y0) * .15 || 1; y0 -= pY; y1 += pY;
  const sx = d => pl + (parseKey(d).getTime() - x0) / (x1 - x0 || 1) * (W - pl - pr);
  const sy = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  const line = series.map((p, i) => `${i ? "L" : "M"}${sx(p.date).toFixed(1)},${sy(p.y).toFixed(1)}`).join("");
  const area = series.length > 1 ? `${line}L${sx(series.at(-1).date).toFixed(1)},${H - pb}L${sx(series[0].date).toFixed(1)},${H - pb}Z` : "";
  const ticks = [y0 + (y1 - y0) * .15, (y0 + y1) / 2, y1 - (y1 - y0) * .15];
  const last = series.at(-1) || all.at(-1); const gid = "g" + uid(); const c = `var(--${color})`;
  const dk = p => p.date;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${c};stop-opacity:.25"/><stop offset="1" style="stop-color:${c};stop-opacity:0"/></linearGradient></defs>
    ${ticks.map(v => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${sy(v)}" y2="${sy(v)}" stroke-dasharray="3 4"/><text x="${pl - 6}" y="${sy(v) + 3}" text-anchor="end">${fmt(v, v >= 100 ? 0 : 1)}</text>`).join("")}
    ${dots ? dots.map(p => `<circle cx="${sx(p.date)}" cy="${sy(p.y)}" r="2.6" style="fill:var(--dim)"/>`).join("") : ""}
    ${area ? `<path d="${area}" fill="url(#${gid})"/>` : ""}
    <path d="${line}" fill="none" style="stroke:${c}" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${sx(last.date)}" cy="${sy(last.y)}" r="5.5" style="fill:var(--s1);stroke:${c}" stroke-width="3"/>
    <text x="${pl}" y="${H - 5}">${shortDate(all.map(dk).sort()[0])}</text>
    <text x="${W - pr}" y="${H - 5}" text-anchor="end">${shortDate(all.map(dk).sort().at(-1))}</text>
  </svg>`;
}

/* ---------- screens ---------- */
function home() {

  const nr = nextRoutine(); const cs = cycleState();
  const food = dayFood(t); const prot = food.reduce((a, f) => a + f.p, 0), cal = food.reduce((a, f) => a + f.cal, 0);

  const backupDue = S.workouts.length + S.body.length > 0 && (!S.settings.lastBackup || (Date.now() - S.settings.lastBackup) > 7 * 864e5);

  if (!nr) hero = `<div class="card hero"><div class="lab">Let's get you started</div><div class="big">Build your first routine</div><div class="sub">Add your workout days so Wallak knows what's next.</div><div class="row" style="margin-top:16px"><button class="btn white grow" data-act="newRoutine">Create a routine</button></div></div>`;

  else if (cs.kind === "rest") hero = `<div class="card hero rest"><div class="lab">${cs.lab}</div><div class="big">Recover today</div><div class="sub">Next up: ${esc(nr.name)}. Eat your protein and sleep well.</div><div class="row" style="margin-top:16px"><button class="btn white grow" data-act="start" data-v="${nr.id}">Train anyway</button></div></div>`;
  else hero = `<div class="card hero"><div class="lab">${cs.lab}</div><div class="big">${esc(nr.name)}</div><div class="sub">${nr.items.length ? nr.items.slice(0, 3).map(i => esc(exById(i.ex).name)).join(" · ") + (nr.items.length > 3 ? ` +${nr.items.length - 3}` : "") : "No exercises yet"}</div><div class="row" style="margin-top:16px"><button class="btn white grow" data-act="start" data-v="${nr.id}">Start workout</button><button class="btn clear" data-act="tab" data-v="train">Other</button></div></div>`;
  return `<div class="screen">
    <div class="top"><div><div class="eyebrow">${longDate(t)}</div><h1 class="h1">${greet}</h1></div>
      ${streak ? `<div class="pill sun">🔥 <span class="num">${streak}</span> day${streak > 1 ? "s" : ""}</div>` : ""}</div>
    <div class="stack">
      ${tip("home")}
      ${backupDue ? `<div class="banner"><div class="grow"><b>Time for a backup.</b> Removing Wallak from your home screen deletes everything on it.</div><button class="btn sm sun" data-act="tab" data-v="more">Back up</button></div>` : ""}
      ${hero}
      <div class="card c-coral"><div class="card-h"><span class="card-t"><span class="ico">${ICON.repeat}</span>${cs.title}</span><button class="link" data-act="tab" data-v="more">${esc(cs.sub)}</button></div><div class="cycle">${cs.tiles}</div><div class="sub" style="margin-top:12px"><span class="abs-tag">★ Abs</span> ${absStreak() ? `bonus ${absStreak()} workout${absStreak() > 1 ? "s" : ""} in a row` : "Tick the abs bonus in your next workout"}</div></div>
      <div class="card c-green"><div class="card-h"><span class="card-t"><span class="ico">${ICON.food}</span>Food today</span><button class="link" data-act="tab" data-v="log">Add</button></div>
        ${S.settings.cal || S.settings.protein ? `<div class="grid2">
          <div><div class="row between"><span class="sub">Calories</span><span class="num">${cal}<span class="sub"> / ${S.settings.cal || "–"}</span></span></div><div class="bar sun" style="margin-top:7px"><i style="width:${S.settings.cal ? Math.min(100, cal / S.settings.cal * 100) : 0}%"></i></div></div>
          <div><div class="row between"><span class="sub">Protein</span><span class="num">${prot}<span class="sub"> / ${S.settings.protein || "–"} g</span></span></div><div class="bar green" style="margin-top:7px"><i style="width:${S.settings.protein ? Math.min(100, prot / S.settings.protein * 100) : 0}%"></i></div></div></div>`
        : `<div class="empty">Set calorie and protein targets in Settings to see your progress here.</div>`}</div>
      <div class="card c-violet"><div class="card-h"><span class="card-t"><span class="ico">${ICON.scale}</span>Bodyweight</span><button class="link" data-act="tab" data-v="log">Log</button></div>
        ${avgNow ? `<div class="stat"><div class="v">${fmt(avgNow)}<small>kg · 7-day avg</small></div>${avgThen ? `<div class="l">${avgNow <= avgThen ? "▼" : "▲"} ${fmt(Math.abs(avgNow - avgThen))} kg in 4 weeks</div>` : ""}</div>
        <div style="margin-top:8px">${chart(bw.map(b => ({ date: b.date, y: avg7(b.date) })), { h: 110, color: "violet", dots: bw.map(b => ({ date: b.date, y: b.w })) })}</div>`
        : `<div class="empty">Weigh in whenever you like. Wallak smooths it into a 7-day average.</div>`}</div>

}

  return `<div class="screen">

        <div class="row between"><div class="grow"><div class="h1" style="font-size:26px">${esc(r.name)}</div><div class="sub">${r.items.length} exercise${r.items.length === 1 ? "" : "s"}${last ? ` · last done ${shortDate(last.date)}` : " · not done yet"}</div></div>

function progress() {
  const used = [...new Set(S.workouts.flatMap(w => w.exercises.map(e => e.ex)))];
  if (!used.includes(progEx)) progEx = used[0] || null;
  const head = `<div class="top"><div><div class="eyebrow">Getting stronger</div><h1 class="h1">Progress</h1></div></div>`;
  const recent = sorted().slice(-12); const absN = recent.filter(w => w.abs).length;
  const absCard = `<div class="card c-sun"><div class="card-h"><span class="card-t"><span class="ico">${ICON.abs}</span>Abs bonus</span>${recent.length ? `<span class="sub">${absN} of last ${recent.length}</span>` : ""}</div>
    ${recent.length ? `<div class="absdots">${recent.map(w => `<i class="${w.abs ? "on" : ""}" title="${shortDate(w.date)}">${w.abs ? "★" : ""}</i>`).join("")}</div><div class="sub" style="margin-top:10px">Current run <b class="num" style="color:var(--fg)">${absStreak()}</b> · best <b class="num" style="color:var(--fg)">${bestAbsRun()}</b> workouts in a row</div>`
    : `<div class="empty">Tick the abs bonus during a workout to earn a ★</div>`}</div>`;
  const goals = `<div class="card c-violet"><div class="card-h"><span class="card-t"><span class="ico">${ICON.target}</span>Goals</span><button class="link" data-act="addGoal">+ Add</button></div><div class="list">
    ${S.goals.length ? S.goals.map(g => { const now = bestE1(g.ex); const pct = Math.min(100, now / g.target * 100); return `<div class="li"><span class="grow"><div class="row between"><span class="t">${esc(exById(g.ex).name)} · ${g.target} kg</span><button class="sub" data-act="rmGoal" data-v="${g.id}" aria-label="Remove goal">✕</button></div><div class="bar violet" style="margin-top:8px"><i style="width:${pct}%"></i></div><div class="sub" style="margin-top:6px">${now ? `Est. 1RM ${fmt(now)} kg · ${fmt(Math.max(0, g.target - now))} kg to go` : "Log this exercise to start tracking"}</div></span></div>`; }).join("")
    : `<div class="empty">Set a target like “Bench press 100 kg” and watch the bar fill.</div>`}</div></div>`;
  if (!progEx) return `<div class="screen">${head}<div class="stack">${tip("prog")}<div class="card empty-card"><div class="big-ico" style="background:var(--violet-soft);color:var(--violet)">${ICON.prog}</div><div class="h1" style="font-size:24px">Charts appear here</div><p class="sub">Finish your first workout and your progress starts tracking itself.</p></div>${absCard}${goals}</div></div>`;
  const hist = exHistory(progEx); const bwEx = hist.every(h => h.heaviest === 0); const u = isTime(progEx) ? "sec" : "reps";
  const METRICS = bwEx ? { best: "Best set", total: "Total" } : { e1rm: "Est. 1RM", heaviest: "Heaviest", volume: "Volume" };
  if (!METRICS[progMetric]) progMetric = Object.keys(METRICS)[0];
  const labels = { heaviest: "Heaviest set", e1rm: "Estimated 1-rep max", volume: "Volume per session", best: `Best set (${u})`, total: `Total ${u} per session` };
  const show = val => progMetric === "volume" ? volHtml(val) : bwEx ? `${Math.round(val)}<small>${u}</small>` : fmt(val) + "<small>kg</small>";
  const series = hist.map(h => ({ date: h.date, y: h[progMetric] })); const cur = series.at(-1), first = series[0];
  const best = Math.max(...hist.map(h => h[progMetric]));
  return `<div class="screen">${head}<div class="stack">
    ${tip("prog")}
    <div class="chips">${used.map(id => `<button class="chip ${id === progEx ? "on" : ""}" data-act="progEx" data-v="${id}">${esc(exById(id).name)}</button>`).join("")}</div>
    <div class="card">
      <div class="seg">${Object.entries(METRICS).map(([k, v]) => `<button class="${k === progMetric ? "on" : ""}" data-act="metric" data-v="${k}">${v}</button>`).join("")}</div>
      <div class="row between" style="margin:16px 0 6px;align-items:flex-end">
        <div class="stat"><div class="v">${show(cur.y)}</div><div class="l">${labels[progMetric]} · latest</div></div>
        ${series.length > 1 && first.y ? `<div class="pill sun">${cur.y >= first.y ? "+" : ""}${fmt((cur.y - first.y) / first.y * 100, 0)}%</div>` : ""}
      </div>
      ${chart(series, { color: "violet" })}
      <div class="grid2" style="margin-top:14px"><div class="stat"><div class="v" style="font-size:24px">${show(best)}</div><div class="l">All-time best</div></div><div class="stat"><div class="v" style="font-size:24px">${hist.length}</div><div class="l">Sessions</div></div></div>
    </div>${absCard}${goals}</div></div>`;
}

      <div class="row"><button class="btn soft sm" data-act="day" data-v="-1" aria-label="Previous day">‹</button><button class="btn soft sm" data-act="day" data-v="1" ${k >= t ? "disabled" : ""} aria-label="Next day">›</button></div></div>

        ${S.savedFoods.length ? `<div class="row between" style="margin-top:12px"><span class="lbl" style="margin:0">Saved meals · tap to add</span><button class="link" data-act="mealsEdit">Edit</button></div><div class="chips">${S.savedFoods.map((f, i) => `<button class="chip green" data-act="addSaved" data-v="${i}">+ ${esc(f.name)}</button>`).join("")}</div>` : ""}
        <div class="row" style="margin-top:12px"><input class="field grow" id="fName" placeholder="Food"><input class="field" id="fCal" inputmode="numeric" placeholder="kcal" style="width:72px"><input class="field" id="fP" inputmode="numeric" placeholder="P g" style="width:62px"></div>
        <div class="row between" style="margin-top:10px"><label class="row sub"><input type="checkbox" id="fSave" checked> Save as a meal for next time</label><button class="btn green sm" data-act="addFood">Add</button></div>

let tick = null;

function finish() {
  const a = S.active; const before = {}; a.exercises.forEach(e => before[e.ex] = bestE1(e.ex));
  const exercises = a.exercises.map(e => ({ ex: e.ex, sets: e.sets.filter(s => s.done && +s.w >= 0 && +s.r > 0).map(s => ({ w: +s.w, r: +s.r, rpe: s.rpe ? +s.rpe : null })) })).filter(e => e.sets.length);

  const w = { id: a.id, date: todayKey(), name: a.name, routine: a.routine, mins: Math.max(1, Math.round((Date.now() - a.start) / 60000)), exercises, abs: (a.abs || []).some(x => x.done), absEx: (a.abs || []).filter(x => x.done).map(x => x.ex) };

    <button class="btn coral block" style="margin-top:16px" data-act="close">Done</button>`);

/* ---------- draw ---------- */
const SCREENS = { home, train, prog: progress, log, more };
function draw() {
  document.querySelectorAll(".sheet").forEach(n => n.dataset.stale = "1");
  if (!S.setupDone) {
    $("#app").innerHTML = ""; $("#tabs").innerHTML = "";
    const old = document.querySelector(".sheet.ob"); document.body.insertAdjacentHTML("beforeend", onboarding());
    const fresh = document.querySelectorAll(".sheet.ob"); if (old) { old.remove(); fresh[fresh.length - 1].style.animation = "none"; }

  }

  $("#tabs").innerHTML = `<div class="tabs-in">${[["home", "Home"], ["train", "Train"], ["prog", "Progress"], ["log", "Log"], ["more", "Settings"]].map(([k, n]) => `<button class="tab ${tab === k ? "on" : ""}" data-act="tab" data-v="${k}">${ICON[k]}${n}</button>`).join("")}</div>`;
  const old = document.querySelector(".sheet.live");
  if (S.active) { const y = old ? old.scrollTop : 0; document.body.insertAdjacentHTML("beforeend", sheet()); const nw = [...document.querySelectorAll(".sheet.live")].at(-1); if (old) { old.remove(); nw.style.animation = "none"; } nw.scrollTop = y; runTimer(); }

/* ---------- events ---------- */
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.in && S.active) { S.active.exercises[el.dataset.e].sets[el.dataset.s][el.dataset.in] = el.value; save(); }
  if (el.dataset.rt && draft) draft.items[el.dataset.i][el.dataset.rt] = Math.max(1, parseInt(el.value) || 1);
  if (el.id === "rtName" && draft) draft.name = el.value;
  if (el.dataset.meal && mealDraft) { const f = mealDraft[el.dataset.i]; f[el.dataset.meal] = el.dataset.meal === "name" ? el.value : parseInt(el.value) || 0; }
});
document.addEventListener("change", e => { const el = e.target; if (el.tagName === "SELECT" && el.dataset.in && S.active) { S.active.exercises[el.dataset.e].sets[el.dataset.s].rpe = el.value; save(); } });

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === "closeBg") { if (e.target === b) { closeModal(); draft = null; } return; }
  if (act !== "discard") discardArmed = false;
  switch (act) {
    /* setup */
    case "obNext": obSave(); if (S.obStep < OB.length - 1) S.obStep++; else { S.setupDone = true; if (parseFloat(S.profile.weight) > 20) { S.body = S.body.filter(x => x.date !== todayKey()); S.body.push({ date: todayKey(), w: parseFloat(S.profile.weight) }); } tab = "home"; } save(); draw(); break;
    case "obBack": obSave(); S.obStep = Math.max(0, S.obStep - 1); save(); draw(); break;
    case "obSex": obSave(); S.profile.sex = v; save(); draw(); break;
    case "schedMode": sched().mode = v; if (!sched().anchor) sched().anchor = todayKey(); save(); draw(); break;
    case "schedPreset": Object.assign(sched(), { pattern: [...PRESETS[+v][1]], start: 0, anchor: todayKey() }); save(); draw(); break;
    case "schedTile": { const sc = sched(); sc.start = patternPos(); sc.anchor = todayKey(); sc.pattern[+v] = sc.pattern[+v] ? 0 : 1; save(); draw(); break; }
    case "schedLen": { const sc = sched(); sc.start = patternPos(); sc.anchor = todayKey(); if (+v > 0) sc.pattern.push(0); else sc.pattern.pop(); sc.start = Math.min(sc.start, sc.pattern.length - 1); save(); draw(); break; }
    case "schedStart": { const sc = sched(); const L = sc.pattern.length; sc.start = (patternPos() + +v + L) % L; sc.anchor = todayKey(); save(); draw(); break; }
    case "schedDay": { const sc = sched(); const d = +v; sc.days = sc.days.includes(d) ? sc.days.filter(x => x !== d) : [...sc.days, d]; save(); draw(); break; }
    case "obSuggest": { obSave(); const p = S.profile; const w = parseFloat(p.weight), h = parseFloat(p.height), a = parseFloat(p.age);
      if (!(w && h && a && p.sex)) { $("#obSugNote").textContent = "Go back and fill in weight, height, age and sex first."; break; }
      const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === "m" ? 5 : -161); const cal = Math.round((bmr * 1.55 + 200) / 50) * 50; const pr = Math.round(w * 2 / 5) * 5;
      $("#obCal").value = cal; $("#obP").value = pr; $("#obSugNote").textContent = "Based on training most days and building muscle while staying lean (+200 kcal). Edit them if you like."; break; }
    /* navigation */
    case "tab": tab = v; draw(); window.scrollTo(0, 0); break;
    case "tipOk": S.tipsSeen[v] = true; save(); draw(); break;
    case "start": startWorkout(v || null); break;
    case "progEx": progEx = v; draw(); break;
    case "metric": progMetric = v; draw(); break;
    case "day": { const n = addDays(logDay, +v); if (n <= todayKey()) { logDay = n; draw(); } break; }
    /* routines */
    case "newRoutine": if (!S.setupDone) obSave(); draft = { isNew: true, id: uid(), name: "", items: [] }; routineEditor(); break;
    case "editRoutine": { if (!S.setupDone) obSave(); const r = S.routines.find(x => x.id === v); draft = JSON.parse(JSON.stringify(r)); routineEditor(); break; }
    case "rtAdd": pickMode = "routine"; pickMuscle = "All"; picker(); break;
    case "backToRt": routineEditor(); break;
    case "rtRm": draft.items.splice(+v, 1); routineEditor(); break;
    case "rtSave": { draft.name = $("#rtName").value.trim(); if (!draft.name) { toast("Give the routine a name"); break; }
      draft.items.forEach(it => { if (it.hi < it.lo) [it.lo, it.hi] = [it.hi, it.lo]; });
      const { isNew, ...r } = draft; const i = S.routines.findIndex(x => x.id === r.id); if (i >= 0) S.routines[i] = r; else S.routines.push(r);
      draft = null; save(); closeModal(); draw(); toast("Routine saved"); break; }
    case "rtDelete": S.routines = S.routines.filter(x => x.id !== draft.id); draft = null; save(); closeModal(); draw(); toast("Routine deleted"); break;
    /* goals */
    case "addGoal": pickMode = "goal"; pickMuscle = "All"; picker(); break;
    case "goalSave": { const t = parseFloat($("#goalT").value); if (!(t > 0)) { toast("Enter a target weight"); break; } S.goals.push({ id: uid(), type: "lift", ex: v, target: t }); save(); closeModal(); draw(); break; }
    case "rmGoal": S.goals = S.goals.filter(g => g.id !== v); save(); draw(); break;
    /* log */
    case "saveBw": { const w = parseFloat($("#bwIn").value.replace(",", ".")); if (!(w > 20 && w < 400)) { toast("Enter your weight in kg, e.g. 79.4"); break; }
      S.body = S.body.filter(x => x.date !== logDay); S.body.push({ date: logDay, w }); S.body.sort((a, c) => a.date < c.date ? -1 : 1); save(); draw(); toast("Weight saved"); break; }
    case "addSaved": { const f = S.savedFoods[v]; (S.food[logDay] = S.food[logDay] || []).push({ id: uid(), ...f }); save(); draw(); break; }
    case "addFood": { const n = $("#fName").value.trim(), c = parseInt($("#fCal").value) || 0, p = parseInt($("#fP").value) || 0;
      if (!n) { toast("Give the food a name"); break; }
      (S.food[logDay] = S.food[logDay] || []).push({ id: uid(), name: n, cal: c, p });
      if ($("#fSave").checked && !S.savedFoods.some(f => f.name.toLowerCase() === n.toLowerCase())) S.savedFoods.push({ name: n, cal: c, p }); save(); draw(); break; }
    case "mealsEdit": mealDraft = S.savedFoods.map(f => ({ ...f })); mealsEditor(); break;
    case "mealDel": mealDraft.splice(+v, 1); mealsEditor(); break;
    case "mealsSave": S.savedFoods = mealDraft.filter(f => f.name.trim()).map(f => ({ ...f, name: f.name.trim() })); mealDraft = null; save(); closeModal(); draw(); toast("Saved meals updated"); break;
    case "rmFood": S.food[logDay] = dayFood(logDay).filter(f => f.id !== v); save(); draw(); break;
    case "mood": { const h = dayHabits(logDay); h.mood = h.mood === +v ? null : +v; save(); draw(); break; }
    /* settings */
    case "saveSettings": Object.assign(S.profile, { name: $("#pName").value.trim(), height: $("#pHeight").value.trim(), age: $("#pAge").value.trim(), sex: $("#pSex").value });
      S.settings.cal = parseInt($("#setCal").value) || ""; S.settings.protein = parseInt($("#setP").value) || ""; save(); draw(); toast("Saved"); break;
    case "backup": {
      const stamp = todayKey(); const name = `wallak-backup-${stamp}.json`;
      const blob = new Blob([JSON.stringify({ ...S, active: null }, null, 1)], { type: "application/json" });
      const file = new File([blob], name, { type: "application/json" });
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: name });
        else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
        S.settings.lastBackup = Date.now(); save(); draw(); toast("Backup ready. Choose “Save to Files” → iCloud Drive.");
      } catch (err) { if (err && err.name !== "AbortError") toast("Couldn't create the backup. Try again."); }
      break; }
    case "restoreOpen": modal(`<h3 class="mh">Restore a backup</h3><p class="sub">Pick your <b>wallak-backup</b> file from Files. This replaces everything currently in the app.</p>
      <label class="btn sun block" style="margin-top:12px">Choose backup file<input type="file" id="rsFile" accept=".json,application/json" hidden></label>
      <details style="margin-top:14px"><summary class="sub">Or paste backup text</summary><textarea class="field" rows="6" id="rsTxt" placeholder="Paste here" style="margin-top:8px"></textarea><button class="btn soft block" style="margin-top:8px" data-act="restore">Restore from text</button></details>`);
      $("#rsFile").addEventListener("change", async ev => { const f = ev.target.files[0]; if (f) restoreFrom(await f.text()); }); break;
    case "restore": restoreFrom($("#rsTxt").value); break;
    case "replay": S.setupDone = false; S.obStep = 0; save(); draw(); break;
    case "wipeAsk": modal(`<h3 class="mh">Erase everything?</h3><p class="sub">All workouts, food, weights and routines will be deleted from this device. This can't be undone.</p><div class="row" style="margin-top:16px"><button class="btn soft grow" data-act="close">Cancel</button><button class="btn danger grow" data-act="wipe">Erase</button></div>`); break;
    case "wipe": S = blank(); save(); closeModal(); tab = "home"; draw(); break;
    /* live workout */
    case "tick": { const s = S.active.exercises[b.dataset.e].sets[b.dataset.s];
      if (!s.done) { const [wi, ri] = b.closest(".set").querySelectorAll("input"); if (s.w === "") s.w = isNaN(parseFloat(wi.placeholder)) ? 0 : wi.placeholder; if (s.r === "") s.r = ri.placeholder; if (s.r === "") { toast(isTime(S.active.exercises[b.dataset.e].ex) ? "Enter seconds first" : "Enter reps first"); break; } }
      s.done = !s.done; save(); draw(); break; }
    case "addSet": { const ex = S.active.exercises[b.dataset.e]; const prev = ex.sets.at(-1) || {}; ex.sets.push({ w: prev.w || "", r: prev.r || "", rpe: "", done: false }); save(); draw(); break; }
    case "pickEx": pickMode = "workout"; pickMuscle = "All"; picker(); break;
    case "pickOne": addPicked(v); break;
    case "pickMuscle": pickMuscle = v; pickResults(); break;
    case "customOpen": customDraft = { name: ($("#exSearch")?.value || "").trim(), muscle: pickMuscle !== "All" ? pickMuscle : "", time: false }; customForm(); break;
    case "customFromSettings": pickMode = "settings"; customDraft = { name: "", muscle: "", time: false }; customForm(); break;
    case "cxMuscle": customDraft.name = $("#cxName").value; customDraft.muscle = v; customForm(); break;
    case "cxTime": customDraft.name = $("#cxName").value; customDraft.time = v === "1"; customForm(); break;
    case "cxBack": customDraft = null; if (pickMode === "settings") closeModal(); else picker(); break;
    case "cxSave": { const name = $("#cxName").value.trim(); if (!name) { toast("Give your exercise a name"); break; }
      if (allEx().some(e => !e.hidden && e.name.toLowerCase() === name.toLowerCase())) { toast("You already have an exercise with that name"); break; }
      const id = "c-" + uid(); S.custom.push({ id, name, muscle: customDraft.muscle || "Other", time: customDraft.time, custom: true }); customDraft = null; save(); addPicked(id); break; }
    case "cxHide": { const c = S.custom.find(e => e.id === v); if (c) c.hidden = true; save(); draw(); toast("Removed from your list"); break; }
    case "absPick": pickMode = "abs"; pickMuscle = "Core"; picker(); break;
    case "absTick": { const x = S.active.abs[+v]; x.done = !x.done; save(); draw(); break; }
    case "absRm": S.active.abs.splice(+v, 1); save(); draw(); break;
    case "discard": if (discardArmed) { S.active = null; discardArmed = false; save(); clearInterval(tick); draw(); toast("Workout discarded"); } else { discardArmed = true; draw(); } break;
    case "finish": finish(); break;
    case "close": closeModal(); break;
  }
});

draw();
// No pinch zoom (iPhone ignores user-scalable=no on its own)
["gesturestart", "gesturechange"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
